{% extends "base.html" %}

{% block title %}Thêm hoa{% endblock %}

{% block content %}
<section class="page-header"><div class="container"><span class="eyebrow">NEW FLOWER</span><h1>Thêm loại hoa</h1></div></section>
<section class="section"><div class="container form-container">
	<form method="POST" class="order-form">
		<div class="form-grid">
			<div class="form-group"><label>Mã hoa *</label><input name="ma_hoa" required></div>
			<div class="form-group"><label>Tên hoa *</label><input name="ten_hoa" required></div>
			<div class="form-group"><label>Số lượng *</label><input type="number" name="so_luong" min="0" required></div>
			<div class="form-group"><label>Giá *</label><input type="number" name="gia" min="0" step="1000" required></div>
			<div class="form-group form-group-full"><label>Tên file ảnh</label><input name="hinh_anh" placeholder="hoa_hong_do.jpg"></div>
		</div>
		<button class="btn btn-primary" type="submit">Lưu hoa</button>
		<a class="btn btn-light" href="{{ url_for('quan_ly_hoa') }}">Hủy</a>
	</form>
</div></section>
{% endblock %}
