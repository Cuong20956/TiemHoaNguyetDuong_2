{% extends "base.html" %}

{% block title %}Sửa hoa{% endblock %}

{% block content %}
<section class="page-header"><div class="container"><span class="eyebrow">EDIT FLOWER</span><h1>Sửa thông tin hoa</h1></div></section>
<section class="section"><div class="container form-container">
	<form method="POST" class="order-form">
		<div class="form-grid">
			<div class="form-group"><label>Mã hoa</label><input value="{{ hoa.ma_hoa }}" readonly></div>
			<div class="form-group"><label>Tên hoa *</label><input name="ten_hoa" value="{{ hoa.ten_hoa }}" required></div>
			<div class="form-group"><label>Số lượng *</label><input type="number" name="so_luong" min="0" value="{{ hoa.so_luong }}" required></div>
			<div class="form-group"><label>Giá *</label><input type="number" name="gia" min="0" step="1000" value="{{ hoa.gia }}" required></div>
			<div class="form-group form-group-full"><label>Tên file ảnh</label><input name="hinh_anh" value="{{ hoa.hinh_anh }}"></div>
		</div>
		<button class="btn btn-primary" type="submit">Cập nhật</button>
		<a class="btn btn-light" href="{{ url_for('quan_ly_hoa') }}">Hủy</a>
	</form>
</div></section>
{% endblock %}
